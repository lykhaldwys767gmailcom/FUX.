<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUX - فوكس</title>
<style>
body{margin:0;font-family:system-ui;background:#0f0f0f;color:white;text-align:center}
header{padding:60px 20px;background:linear-gradient(135deg,#ff2d55,#7c00ff)}
h1{font-size:55px;margin:0}
p{color:#ddd}
.card{background:#1c1c1e;margin:15px;padding:20px;border-radius:20px;text-align:right}
button{background:#ff2d55;color:white;border:0;padding:15px 30px;border-radius:30px;font-size:18px;width:90%}
input{width:90%;padding:14px;border-radius:15px;border:0;margin:10px 0}
</style>
</head>
<body>
<header>
<h1>FUX</h1>
<p>لم يتم تقديم أي وصف أو موقع أو الكتروني أو تواصل.</p>
<p>تطبيقك الجديد يبدأ من هنا</p>
</header>
<div style="padding:20px">
<div class="card"><h3>🔥 اكتشف</h3><p>محتوى جديد كل يوم، مصمم لك.</p></div>
<div class="card"><h3>💬 تواصل</h3><p>تابع أصدقائك وتواصل معهم بسهولة.</p></div>
<div class="card"><h3>⭐ المفضلة</h3><p>احفظ اللي يعجبك وارجع له بأي وقت.</p></div>
<h3>سجل دخولك</h3>
<input placeholder="الإيميل">
<input placeholder="كلمة السر" type="password">
<br><button>دخول إلى FUX</button>
</div>
</body>
</html>
